<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}CloudCO{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#121212;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f5f5f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e0e0e0;">
          <tr>
            <td style="padding:32px 32px 24px;border-bottom:1px solid #e0e0e0;">
              <p style="margin:0;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#4a4a4a;">CloudCO One</p>
              <h1 style="margin:8px 0 0;font-size:22px;font-weight:600;color:#121212;">{% block email_heading %}{% endblock %}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;font-size:15px;line-height:1.6;color:#292929;">
              {% block email_body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 28px;border-top:1px solid #e0e0e0;font-size:12px;line-height:1.5;color:#4a4a4a;">
              {% block email_footer %}
              <p style="margin:0;">Este correo fue enviado por {{ current_site.name|default:"CloudCO One" }}.</p>
              <p style="margin:8px 0 0;">Si no solicitaste esta acción, puedes ignorar este mensaje.</p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
